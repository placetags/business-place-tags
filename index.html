<!DOCTYPE html>
<html lang="el" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light" id="colorSchemeMeta">
<meta name="theme-color" content="#1B4B66" id="themeColorMeta">

<title id="pageTitle">Καλώς ορίσατε</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wash:#F4EFE2;
    --wash-deep:#E4DBC4;
    --ink:#232019;
    --aegean:#1B4B66;
    --aegean-deep:#123342;
    --terracotta:#C1592F;
    --olive:#5C6B3F;
    --sun:#E8AA3D;
    --card:#FCFAF3;
    --muted:#79715C;
  }
  html[data-theme="dark"]{
    --wash:#18160F;
    --wash-deep:#2B2820;
    --ink:#EFE9D8;
    --aegean:#3E7EA3;
    --aegean-deep:#1B4B66;
    --terracotta:#D97748;
    --olive:#8AA05F;
    --sun:#F0BE5C;
    --card:#221F18;
    --muted:#A79C82;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--wash);}
  body{
    background:var(--wash);
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    line-height:1.5;
    padding-bottom:60px;
    transition:background .2s ease, color .2s ease;
  }
  .wrap{max-width:460px; margin:0 auto; padding:0 18px;}
  .topbar{
    max-width:460px; margin:0 auto;
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px;
    background:var(--wash);
  }
  .lang-row{display:flex; gap:6px;}
  .lang-btn{
    background:var(--card);
    border:1.5px solid var(--wash-deep);
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    font-size:0.72rem; font-weight:700;
    padding:5px 10px;
    border-radius:14px;
    cursor:pointer;
  }
  .lang-btn.active{
    background:var(--aegean);
    border-color:var(--aegean);
    color:#fff;
  }
  .theme-toggle{
    background:var(--card);
    border:1.5px solid var(--wash-deep);
    width:30px; height:30px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:0.95rem;
  }
  header.hero{
    background: var(--aegean);
    color:var(--wash);
    padding:36px 18px 30px;
    text-align:center;
    transition:background .2s ease;
  }
  .eyebrow{
    font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--sun); font-weight:700; margin-bottom:8px;
  }
  h1{
    font-family:'Fraunces', serif; font-weight:600;
    font-size:1.7rem; line-height:1.2;
  }
  .wifi-card{
    background:var(--card);
    margin:-20px 18px 0;
    border-radius:14px;
    padding:18px 20px;
    box-shadow:0 10px 26px rgba(18,51,66,0.18);
    position:relative; z-index:2;
  }
  .wifi-row{display:flex; justify-content:space-between; gap:14px;}
  .wifi-label{font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); font-weight:700;}
  .wifi-value{font-family:'Fraunces', serif; font-size:1.1rem; font-weight:600; margin-top:2px;}
  .divider-dash{border:none; border-top:1.5px dashed var(--wash-deep); margin:12px 0;}
  .orbit-section{padding:38px 0 0; text-align:center;}
  .section-title{font-family:'Fraunces', serif; font-size:1.35rem; font-weight:600;}
  .section-sub{color:var(--muted); font-size:0.87rem; margin:4px 0 26px;}
  .orbit-stage{
    position:relative;
    width:100%;
    max-width:340px;
    aspect-ratio:1/1;
    margin:0 auto;
  }
  .orbit-ring{
    position:absolute; inset:0;
    border-radius:50%;
    border:1.5px dashed var(--wash-deep);
  }
  .avatar{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:38%;
    filter:drop-shadow(0 8px 14px rgba(18,51,66,0.25));
  }
  .avatar-caption{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:0.95rem;
    color:var(--aegean-deep);
    margin-top:16px;
  }
  .cat-btn{
    position:absolute;
    width:68px; height:68px;
    border-radius:50%;
    background:var(--card);
    border:2px solid var(--wash-deep);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px;
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    transform-origin:center;
    color:var(--ink);
  }
  .cat-btn svg{width:22px; height:22px;}
  .cat-btn span{font-size:0.62rem; font-weight:700; color:var(--ink);}
  .cat-btn.active{
    background:var(--terracotta);
    border-color:var(--terracotta);
    transform:scale(1.12);
  }
  .cat-btn.active span{color:#fff;}
  .cat-btn.active svg path{stroke:#fff;}
  .panel{margin-top:30px; text-align:left; min-height:40px;}
  .panel-hint{
    text-align:center; color:var(--muted); font-size:0.85rem;
    padding:10px 30px;
  }
  .panel-title{
    font-family:'Fraunces', serif; font-size:1.15rem; font-weight:600;
    display:flex; align-items:center; gap:8px; margin-bottom:14px;
  }
  .panel-title .dot{width:9px; height:9px; border-radius:50%; background:var(--terracotta);}
  .region-row{
    display:flex; gap:8px; overflow-x:auto;
    padding-bottom:6px; margin-bottom:16px;
  }
  .region-chip{
    flex:0 0 auto;
    background:var(--card);
    border:1.5px solid var(--wash-deep);
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    font-size:0.8rem; font-weight:600;
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
  }
  .region-chip.active{
    background:var(--aegean);
    border-color:var(--aegean);
    color:#fff;
  }
  .top-label{
    font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--muted); font-weight:700; margin-bottom:8px;
  }
  .top-row{
    display:flex; gap:10px; overflow-x:auto;
    padding-bottom:10px; margin-bottom:18px;
    scroll-snap-type:x proximity;
  }
  .top-card{
    flex:0 0 auto;
    scroll-snap-align:start;
    width:170px;
    background:var(--card);
    border:1px solid var(--wash-deep);
    border-radius:12px;
    padding:12px 14px;
    position:relative;
  }
  .top-card .star-badge{
    position:absolute; top:10px; right:10px;
    background:var(--sun); color:var(--aegean-deep);
    font-size:0.68rem; font-weight:700;
    padding:2px 7px; border-radius:10px;
    display:flex; align-items:center; gap:3px;
  }
  .top-card .place-name{font-size:0.9rem; padding-right:34px;}
  .top-card .place-desc{font-size:0.78rem; margin-top:4px;}
  .filter-row{
    display:flex; gap:8px; margin-bottom:16px;
  }
  .filter-btn{
    flex:1;
    background:var(--card);
    border:1.5px solid var(--wash-deep);
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    font-size:0.78rem; font-weight:600;
    padding:9px 10px;
    border-radius:10px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .filter-btn.active{
    background:var(--olive);
    border-color:var(--olive);
    color:#fff;
  }
  .place-card{
    background:var(--card);
    border:1px solid var(--wash-deep);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  .place-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .place-name{font-family:'Fraunces', serif; font-weight:600; font-size:1rem;}
  .place-city{font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--olive); font-weight:700; white-space:nowrap;}
  .place-desc{font-size:0.86rem; color:var(--ink); margin-top:5px;}
  .place-meta{font-size:0.76rem; color:var(--muted); margin-top:4px; display:flex; gap:10px; align-items:center;}
  .place-foot{margin-top:10px; display:flex; gap:8px;}
  .map-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--aegean); color:#fff;
    font-size:0.78rem; font-weight:600;
    padding:7px 13px; border-radius:20px;
    text-decoration:none;
  }
  .load-more-btn{
    display:block; width:100%;
    background:var(--card); border:1.5px dashed var(--wash-deep);
    color:var(--aegean-deep); font-weight:700; font-size:0.85rem;
    padding:12px; border-radius:12px; cursor:pointer; margin-top:6px;
  }
  .load-more-btn:disabled{opacity:0.5; cursor:default;}
  footer{margin-top:44px; text-align:center; color:var(--muted); font-size:0.76rem; padding:0 20px;}
</style>
</head>
<body>

<script>
  const DATA_BASE = './data';

  const TEXT = {
    el: {
      langLabel: 'ΕΛ',
      eyebrow: 'Κρήτη',
      exploreTitle: 'Εξερεύνησε την Κρήτη',
      chooseCategoryPrefix: 'Διάλεξε κατηγορία γύρω από τον',
      tapHint: 'Πάτησε ένα εικονίδιο για να δεις προτάσεις σε όλη την Κρήτη',
      wifiNetwork: 'Δίκτυο Wi‑Fi', wifiPassword: 'Κωδικός', checkout: 'Check‑out', host: 'Host',
      topLabel: '✨ Τα πιο διάσημα (4.8+ ⭐)',
      filterDefault: 'Προεπιλογή', filterRandom: '🔀 Τυχαία', filterDistance: '📍 Πιο κοντινά',
      locating: '📍 Εντοπισμός...',
      locationError: 'Δεν μπόρεσα να πάρω την τοποθεσία σου. Έλεγξε τα δικαιώματα τοποθεσίας του browser.',
      noTop: 'Δεν έχουμε ακόμα κορυφαία μέρη εδώ.',
      loadError: 'Σφάλμα φόρτωσης.',
      dataError: 'Σφάλμα φόρτωσης δεδομένων. Έλεγξε ότι ο server τρέχει.',
      noPlaces: 'Δεν έχουμε ακόμα προτάσεις εδώ.',
      loading: 'Φόρτωση...',
      loadMore: (n) => `Δες περισσότερα (${n} ακόμα)`,
      openMaps: 'Άνοιγμα σε Maps',
      categorySuffix: 'στην Κρήτη',
      footerNfc: 'Αυτή η σελίδα ανοίγει με ένα άγγιγμα στο NFC μπρελόκ των κλειδιών σου.',
      aboutUs: 'About us:',
      welcomeTitle: 'Καλώς ορίσατε στο',
      tabTitle: 'Καλώς ορίσατε — ',
      kmUnit: 'χλμ',
      categories: { cafe:'Καφέ', food:'Φαγητό', sights:'Αξιοθέατα', fun:'Διασκέδαση', beach:'Παραλίες' },
      regions: { irakleio:'Ηράκλειο', chania:'Χανιά', rethymno:'Ρέθυμνο', lasithi:'Λασίθι' },
    },
    en: {
      langLabel: 'EN',
      eyebrow: 'Crete',
      exploreTitle: 'Explore Crete',
      chooseCategoryPrefix: 'Pick a category around',
      tapHint: 'Tap an icon to see suggestions across Crete',
      wifiNetwork: 'Wi‑Fi Network', wifiPassword: 'Password', checkout: 'Check‑out', host: 'Host',
      topLabel: '✨ Top rated (4.8+ ⭐)',
      filterDefault: 'Default', filterRandom: '🔀 Random', filterDistance: '📍 Nearest',
      locating: '📍 Locating...',
      locationError: "Couldn't get your location. Check your browser's location permissions.",
      noTop: 'No top picks here yet.',
      loadError: 'Loading error.',
      dataError: 'Error loading data. Make sure the server is running.',
      noPlaces: 'No suggestions here yet.',
      loading: 'Loading...',
      loadMore: (n) => `Show more (${n} more)`,
      openMaps: 'Open in Maps',
      categorySuffix: 'in Crete',
      footerNfc: 'This page opens with a tap on your NFC keychain.',
      aboutUs: 'About us:',
      welcomeTitle: 'Welcome to',
      tabTitle: 'Welcome — ',
      kmUnit: 'km',
      categories: { cafe:'Cafe', food:'Food', sights:'Sights', fun:'Nightlife', beach:'Beaches' },
      regions: { irakleio:'Heraklion', chania:'Chania', rethymno:'Rethymno', lasithi:'Lasithi' },
    },
  };

  const AVAILABLE_LANGS = ['el', 'en'];
  let currentLang = localStorage.getItem('jjLang') || 'el';
  if (!TEXT[currentLang]) currentLang = 'el';

  function t(key){ return TEXT[currentLang][key]; }

  function pickLang(value){
    if (value && typeof value === 'object') return value[currentLang] || value.el || value.en || '';
    return value || '';
  }

  let currentTheme = localStorage.getItem('jjTheme') || 'light';

  function applyTheme(theme){
    currentTheme = theme;
    document.getElementById('htmlRoot').setAttribute('data-theme', theme);
    document.getElementById('colorSchemeMeta').setAttribute('content', theme === 'dark' ? 'dark' : 'light');
    document.getElementById('themeColorMeta').setAttribute('content', theme === 'dark' ? '#18160F' : '#1B4B66');
    document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('jjTheme', theme);
  }

  document.getElementById('themeToggle').addEventListener('click', () => {
    applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
  });

  applyTheme(currentTheme);

  const langRow = document.getElementById('langRow');
  AVAILABLE_LANGS.forEach(lang => {
    const btn = document.createElement('button');
    btn.className = 'lang-btn' + (lang === currentLang ? ' active' : '');
    btn.textContent = TEXT[lang].langLabel;
    btn.addEventListener('click', () => setLanguage(lang));
    btn.dataset.lang = lang;
    langRow.appendChild(btn);
  });

  function setLanguage(lang){
    currentLang = lang;
    localStorage.setItem('jjLang', lang);
    document.getElementById('htmlRoot').setAttribute('lang', lang);
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    applyStaticTexts();
    refreshCategoryButtonLabels();
    if (currentCategory) renderPanel();
  }

  function applyStaticTexts(){
    document.getElementById('heroEyebrow').textContent = t('eyebrow');
    document.getElementById('exploreTitle').textContent = t('exploreTitle');
    document.getElementById('tapHint').textContent = t('tapHint');
    document.getElementById('lblWifiNetwork').textContent = t('wifiNetwork');
    document.getElementById('lblWifiPassword').textContent = t('wifiPassword');
    document.getElementById('lblCheckout').textContent = t('checkout');
    document.getElementById('lblHost').textContent = t('host');
    document.getElementById('footerNfc').textContent = t('footerNfc');
    document.getElementById('aboutUsLabel').textContent = t('aboutUs');
    if (window.__clientCfg) {
      const cfg = window.__clientCfg;
      const avatarName = pickLang(cfg.avatarName) || (currentLang === 'en' ? 'the character' : 'χαρακτήρα');
      document.getElementById('sectionSub').textContent = t('chooseCategoryPrefix') + ' ' + avatarName;
      document.getElementById('avatarCaption').textContent = pickLang(cfg.avatarCaption);
      document.getElementById('pageTitle').textContent = t('tabTitle') + cfg.siteTitle;
      document.getElementById('heroTitle').innerHTML = t('welcomeTitle') + '<br>' + cfg.siteTitle;
    }
  }

  function applyClientConfig(cfg){
    window.__clientCfg = cfg;
    document.getElementById('heroSection').style.background =
      'linear-gradient(180deg, rgba(18,51,66,0.35) 0%, rgba(18,51,66,0.75) 100%), url(\'' + cfg.heroImage + '\') center/cover no-repeat';
    document.getElementById('wifiNetwork').textContent = cfg.wifiNetwork;
    document.getElementById('wifiPassword').textContent = cfg.wifiPassword;
    document.getElementById('wifiCheckout').textContent = cfg.checkout;
    document.getElementById('wifiHost').textContent = cfg.hostPhone;
    const aboutLink = document.getElementById('aboutLink');
    aboutLink.href = cfg.aboutUrl;
    aboutLink.textContent = cfg.aboutUrl;

    if (cfg.theme) {
      const map = {
        wash:'--wash', washDeep:'--wash-deep', ink:'--ink',
        aegean:'--aegean', aegeanDeep:'--aegean-deep',
        terracotta:'--terracotta', olive:'--olive', sun:'--sun', card:'--card',
        muted:'--muted'
      };
      const declarations = Object.keys(map)
        .filter(key => cfg.theme[key])
        .map(key => `${map[key]}: ${cfg.theme[key]};`)
        .join(' ');

      let styleTag = document.getElementById('clientThemeVars');
      if (!styleTag) {
        styleTag = document.createElement('style');
        styleTag.id = 'clientThemeVars';
        document.head.appendChild(styleTag);
      }
      styleTag.textContent = `:root{ ${declarations} }`;
    }

    if (cfg.avatarImage) {
      document.getElementById('defaultAvatarSvg').style.display = 'none';
      const img = document.getElementById('customAvatarImg');
      img.src = cfg.avatarImage;
      img.style.display = 'block';
    }

    applyStaticTexts();
  }

  function showConfigError(message){
    document.getElementById('heroTitle').textContent = 'Δεν βρέθηκε το κατάλυμα';
    document.getElementById('heroSection').style.background = 'var(--aegean)';
    const wrap = document.querySelector('.wrap');
    const err = document.createElement('div');
    err.style.cssText = 'background:#FBEAF0; border:1px solid #ED93B1; color:#4B1528; padding:14px 18px; border-radius:12px; margin:-20px 18px 0; position:relative; z-index:2; font-size:0.88rem;';
    err.textContent = message;
    wrap.insertBefore(err, wrap.firstChild.nextSibling);
  }

  const clientKey = new URLSearchParams(window.location.search).get('client');

  if (!clientKey) {
    showConfigError('Λείπει το ?client= από το URL. Παράδειγμα: /?client=lemonia');
  } else {
    fetch('clients/' + clientKey + '.json')
      .then(res => { if (!res.ok) throw new Error('not found'); return res.json(); })
      .then(cfg => applyClientConfig(cfg))
      .catch(() => showConfigError('Δεν βρέθηκε config για "' + clientKey + '". Έλεγξε ότι υπάρχει το αρχείο clients/' + clientKey + '.json'));
  }

  applyStaticTexts();

  const CATEGORY_ICONS = {
    cafe:   'M4 9h13a3 3 0 010 6h-1M4 9v7a3 3 0 003 3h6a3 3 0 003-3V9M4 9V6h13v3',
    food:   'M6 3v7a2 2 0 002 2 2 2 0 002-2V3M8 12v9M18 3c-2 0-3 2-3 5v3h2v7',
    sights: 'M3 20h18M5 20V10l7-6 7 6v10M9 20v-6h6v6',
    fun:    'M9 18V5l12-2v13M9 9l12-2M6 21a3 3 0 100-6 3 3 0 000 6zM18 19a3 3 0 100-6 3 3 0 000 6z',
    beach:  'M2 20c2-2 4-2 6 0s4 2 6 0 4-2 6 0M12 4v9M8 8l4-4 4 4',
  };
  const CATEGORY_KEYS = ['cafe', 'food', 'sights', 'fun', 'beach'];
  const REGION_KEYS = ['irakleio', 'chania', 'rethymno', 'lasithi'];

  const PAGE_SIZE = 20;

  const stage = document.getElementById('orbitStage');
  const panel = document.getElementById('panel');
  const radius = 130;
  const n = CATEGORY_KEYS.length;

  let currentCategory = null;
  let currentRegion = null;
  let currentSort = 'default';
  let currentOffset = 0;
  let userLocation = null;

  CATEGORY_KEYS.forEach((key, i) => {
    const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
    const btn = document.createElement('div');
    btn.className = 'cat-btn';
    btn.style.left = `calc(50% + ${Math.cos(angle) * radius}px - 34px)`;
    btn.style.top = `calc(50% + ${Math.sin(angle) * radius}px - 34px)`;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${CATEGORY_ICONS[key]}"/></svg><span></span>`;
    btn.addEventListener('click', () => selectCategory(key, btn));
    btn.dataset.key = key;
    stage.appendChild(btn);
  });

  function refreshCategoryButtonLabels(){
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.querySelector('span').textContent = t('categories')[btn.dataset.key];
    });
  }
  refreshCategoryButtonLabels();

  function selectCategory(key, btnEl){
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
    currentCategory = key;
    currentRegion = REGION_KEYS[0];
    currentSort = 'default';
    currentOffset = 0;
    renderPanel();
  }

  function getUserLocation(){
    if (userLocation) return Promise.resolve(userLocation);
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error('no geolocation'));
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          resolve(userLocation);
        },
        (err) => reject(err),
        { timeout: 8000 }
      );
    });
  }

  function distanceKm(lat1, lng1, lat2, lng2){
    const R = 6371;
    const dLat = ((lat2 - lat1) * Math.PI) / 180;
    const dLng = ((lng2 - lng1) * Math.PI) / 180;
    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function shuffle(array){
    const copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  const staticDataCache = {};

  async function loadStaticPlaces(category, region){
    const key = `${category}-${region}`;
    if (staticDataCache[key]) return staticDataCache[key];

    const res = await fetch(`${DATA_BASE}/${key}.json`);
    if (!res.ok) throw new Error('data file not found: ' + key);
    const places = await res.json();
    staticDataCache[key] = places;
    return places;
  }

  async function fetchPlaces({ featured = false, sort = 'default', limit = PAGE_SIZE, offset = 0 } = {}){
    let list = await loadStaticPlaces(currentCategory, currentRegion);

    if (featured) {
      list = list.filter((p) => p.featured).sort((a, b) => (b.rating || 0) - (a.rating || 0));
    }

    if (sort === 'random') {
      list = shuffle(list);
    } else if (sort === 'distance' && userLocation) {
      list = list
        .map((p) => ({ ...p, distanceKm: distanceKm(userLocation.lat, userLocation.lng, p.lat, p.lng) }))
        .sort((a, b) => a.distanceKm - b.distanceKm);
    }

    const total = list.length;
    const page = list.slice(offset, offset + limit);

    return {
      total,
      limit,
      offset,
      hasMore: offset + limit < total,
      places: page,
    };
  }

  function renderPanel(){
    panel.innerHTML = `
      <div class="panel-title"><span class="dot"></span>${t('categories')[currentCategory]} ${t('categorySuffix')}</div>
      <div class="region-row" id="regionRow"></div>

      <div class="top-label">${t('topLabel')}</div>
      <div class="top-row" id="topRow"><div class="panel-hint">${t('loading')}</div></div>

      <div class="filter-row" id="filterRow">
        <button class="filter-btn active" data-sort="default">${t('filterDefault')}</button>
        <button class="filter-btn" data-sort="random">${t('filterRandom')}</button>
        <button class="filter-btn" data-sort="distance">${t('filterDistance')}</button>
      </div>

      <div id="placeList"><div class="panel-hint">${t('loading')}</div></div>
    `;

    const regionRow = document.getElementById('regionRow');
    REGION_KEYS.forEach(key => {
      const chip = document.createElement('button');
      chip.className = 'region-chip' + (key === currentRegion ? ' active' : '');
      chip.textContent = t('regions')[key];
      chip.addEventListener('click', () => {
        currentRegion = key;
        currentSort = 'default';
        currentOffset = 0;
        renderPanel();
      });
      regionRow.appendChild(chip);
    });

    document.querySelectorAll('#filterRow .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => onFilterClick(btn.dataset.sort, btn));
    });

    loadTopSection();
    loadPlaceList({ reset: true });
  }

  async function onFilterClick(sort, btnEl){
    if (sort === 'distance') {
      btnEl.textContent = t('locating');
      try {
        await getUserLocation();
      } catch (e) {
        btnEl.textContent = t('filterDistance');
        alert(t('locationError'));
        return;
      }
      btnEl.textContent = t('filterDistance');
    }

    document.querySelectorAll('#filterRow .filter-btn').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
    currentSort = sort;
    currentOffset = 0;
    loadPlaceList({ reset: true });
  }

  async function loadTopSection(){
    const topRow = document.getElementById('topRow');
    try {
      const data = await fetchPlaces({ featured: true, limit: 6, offset: 0 });
      if (!data.places.length) {
        topRow.innerHTML = `<div class="panel-hint">${t('noTop')}</div>`;
        return;
      }
      topRow.innerHTML = data.places.map(p => `
        <div class="top-card">
          <div class="star-badge">⭐ ${p.rating}</div>
          <div class="place-name">${p.name}</div>
          <div class="place-desc">${p.desc || ''}</div>
        </div>
      `).join('');
    } catch (e) {
      topRow.innerHTML = `<div class="panel-hint">${t('loadError')}</div>`;
    }
  }

  async function loadPlaceList({ reset }){
    const listEl = document.getElementById('placeList');
    if (reset) {
      currentOffset = 0;
      listEl.innerHTML = `<div class="panel-hint">${t('loading')}</div>`;
    }

    const regionLabel = t('regions')[currentRegion];

    try {
      const data = await fetchPlaces({ sort: currentSort, offset: currentOffset, limit: PAGE_SIZE });

      const cardsHtml = data.places.map(p => `
        <div class="place-card">
          <div class="place-top">
            <div class="place-name">${p.name}</div>
            <div class="place-city">${regionLabel}</div>
          </div>
          <div class="place-desc">${p.desc || ''}</div>
          <div class="place-meta">
            ${p.rating ? `⭐ ${p.rating}` : ''}
            ${typeof p.distanceKm === 'number' ? ` · ${p.distanceKm.toFixed(1)} ${t('kmUnit')}` : ''}
          </div>
          <div class="place-foot">
            <a class="map-btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}&query_place_id=${p.placeId}" target="_blank" rel="noopener">${t('openMaps')}</a>
          </div>
        </div>
      `).join('');

      if (reset) {
        listEl.innerHTML = data.places.length ? cardsHtml : `<div class="panel-hint">${t('noPlaces')}</div>`;
      } else {
        listEl.querySelector('.load-more-btn')?.remove();
        listEl.insertAdjacentHTML('beforeend', cardsHtml);
      }

      currentOffset += data.places.length;

      if (data.hasMore) {
        listEl.insertAdjacentHTML('beforeend', `<button class="load-more-btn" id="loadMoreBtn">${t('loadMore')(data.total - currentOffset)}</button>`);
        document.getElementById('loadMoreBtn').addEventListener('click', (e) => {
          e.target.disabled = true;
          e.target.textContent = t('loading');
          loadPlaceList({ reset: false });
        });
      }
    } catch (e) {
      listEl.innerHTML = `<div class="panel-hint">${t('dataError')}</div>`;
    }
  }
</script>

</body>
